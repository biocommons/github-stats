[project]
name = "github-stats"
version = "0.1.0"
description = "GitHub activity stats collector for biocommons"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "diskcache>=5.6",
    "loguru>=0.7.0",
    "click>=8.1.0",
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.13",
]

